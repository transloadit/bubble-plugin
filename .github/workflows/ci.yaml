name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.23.4', '26.12.1']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0 && corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn check
      - run: corepack yarn playwright install chromium
      - run: corepack yarn test:browser
  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - run: npm install --global corepack@0.36.0 && corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn playwright install chromium
      - run: corepack yarn test:e2e
        env:
          TRANSLOADIT_KEY: ${{ secrets.BUBBLE_E2E_TRANSLOADIT_KEY }}
          TRANSLOADIT_SECRET: ${{ secrets.BUBBLE_E2E_TRANSLOADIT_SECRET }}
