name: Release candidate
on:
  push:
    branches: [main]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - run: npm install --global corepack@0.36.0 && corepack enable
      - run: corepack yarn install --immutable
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: corepack yarn changeset:version:release
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: corepack yarn release:prepare
      - uses: actions/upload-artifact@v7
        with:
          name: bubble-candidate-${{ github.sha }}
          path: build/bubble-plugin-*.zip*
